      ${lf.wit ? `<p class="record"><a href="${esc(lf.wit)}" target="_blank" rel="noopener">View ${esc(lf.name)} on Waste Impact Tracker</a></p>` : ''}
    </aside>`;
}

const EJ_METRICS = [
  { key: 'bipoc', prop: 'bipocP', label: 'People of color (BIPOC)' },
  { key: 'lowIncome', prop: 'lowIncomeP', label: 'Low income' },
  { key: 'under5', prop: 'under5P', label: 'Children under 5' },
  { key: 'over64', prop: 'over64P', label: 'Adults over 64' },
];

// Population-weighted averages across landfill communities, by state and nationally
function computeEjAverages() {
  const acc = { national: {}, states: {} };
  const add = (bucket, key, pop, v) => { bucket[key] = bucket[key] || { w: 0, s: 0 }; bucket[key].w += pop; bucket[key].s += pop * v; };
  for (const l of LANDFILLS.values()) {
    if (!l.pop) continue;
    const st = (l.state || '').toLowerCase();
    for (const m of EJ_METRICS) {
      const v = l[m.prop];
      if (v == null) continue;
      add(acc.national, m.key, l.pop, v);
      if (st) { acc.states[st] = acc.states[st] || {}; add(acc.states[st], m.key, l.pop, v); }
    }
  }
  const fin = b => Object.fromEntries(Object.entries(b).map(([k, { w, s }]) => [k, w ? s / w : null]));
  return { national: fin(acc.national), states: Object.fromEntries(Object.entries(acc.states).map(([k, b]) => [k, fin(b)])) };
}
function weightedEj(list) {
  const out = {};
  for (const m of EJ_METRICS) {
    let w = 0, s = 0;
    for (const l of list) { const v = l[m.prop]; if (l.pop && v != null) { w += l.pop; s += l.pop * v; } }
    out[m.key] = w ? s / w : null;
  }
  return out;
}
function stateFor(name) {
  const n = (name || '').toLowerCase();
  return STATES.find(s => s.name.toLowerCase() === n || (s.abbr && s.abbr.toLowerCase() === n)) || null;
}
// The two reference points for a metric: state + national. General-population benchmarks win when present.
function ejRefs(key, stateName) {
  const refs = [];
  if (stateName) {
    const st = stateFor(stateName);
    const bench = st?.bench?.[key];
    if (bench != null) refs.push({ cls: 'm-state', label: `${stateName} overall`, v: bench });
    else {
      const v = EJ_AVG?.states[stateName.toLowerCase()]?.[key];
      if (v != null) refs.push({ cls: 'm-state', label: `${stateName} landfill communities`, v });
    }
  }
  const nb = CONFIG.nationalBenchmarks[key];
  if (nb != null) refs.push({ cls: 'm-nat', label: 'U.S. overall', v: nb });
  else if (EJ_AVG?.national[key] != null) refs.push({ cls: 'm-nat', label: 'All U.S. landfill communities', v: EJ_AVG.national[key] });
  return refs;
}
function cmpText(v, ref) {
  const d = v - ref.v;
  if (Math.abs(d) <= ref.v * 0.1) return `about the same as ${esc(ref.label)} (${fmtP(ref.v)})`;
  return `<strong>${fmtNum(Math.abs(d))} points ${d > 0 ? 'higher' : 'lower'}</strong> than ${esc(ref.label)} (${fmtP(ref.v)})`;
}

function ejBars(values, stateName, subject = 'This community') {
  const rows = EJ_METRICS.filter(m => values[m.key] != null).map(m => {
    const v = values[m.key], refs = ejRefs(m.key, stateName);
    const top = Math.max(v, ...refs.map(r => r.v));
    const scale = Math.min(100, Math.max(10, Math.ceil(top * 1.2 / 10) * 10));
    const pos = x => `${Math.min(100, x / scale * 100).toFixed(2)}%`;
    const elevated = refs.length && v > refs[0].v * 1.1;
    return `
      <div class="ej-row">
        <div class="ej-head"><span class="ej-label">${esc(m.label)}</span><span class="ej-val${elevated ? ' hot' : ''}">${fmtP(v)}</span></div>
        <div class="ej-track" role="img" aria-label="${esc(m.label)}: ${fmtP(v)}${refs.map(r => `. ${r.label}: ${fmtP(r.v)}`).join('')}">
          <div class="ej-fill${elevated ? ' hot' : ''}" style="width:${pos(v)}"></div>
          ${refs.map(r => `<span class="ej-mark ${r.cls}" style="left:${pos(r.v)}"></span>`).join('')}
        </div>
        <div class="ej-scale"><span>0%</span><span>${scale}%</span></div>
        ${refs.length ? `<p class="ej-cmp">${refs.map(r => cmpText(v, r)).join('; ')}.</p>` : ''}
      </div>`;
  });
  if (!rows.length) return '';
  const refsAny = ejRefs('bipoc', stateName).length ? ejRefs('bipoc', stateName) : ejRefs('lowIncome', stateName);
  const general = refsAny.some(r => / overall$/.test(r.label));
  return `
    <div class="ej-bars">${rows.join('')}</div>
    <div class="legend">
      <span><i style="background:var(--bar)"></i>${esc(subject)}</span>
      ${stateName ? `<span><i class="lg-mark" style="background:var(--ink)"></i>${esc(stateName)}</span>` : ''}
      <span><i class="lg-mark" style="background:var(--teal)"></i>United States</span>
    </div>
    <p class="note" style="margin-top:8px">${general
      ? 'Comparisons are with the general population, from the benchmark fields in State Data and CONFIG.'
      : 'Comparisons are population-weighted averages across all landfill communities in FCF’s tracker, since general-population benchmarks haven’t been added yet.'} Values within 10% of a comparison count as about the same; coral marks a value more than 10% above the ${stateName ? 'state' : 'national'} comparison.</p>`;
}

function communityHTML(lf) {
  const vals = Object.fromEntries(EJ_METRICS.map(m => [m.key, lf[m.prop]]));
  const bars = ejBars(vals, lf.state || '');
  if (lf.pop == null && !bars) return '';
  return `
    <section class="block">
      <h3>People living nearby</h3>
      <p class="note">Census tracts within 5 miles of the landfill, from FCF’s landfill tracker.</p>
      ${lf.pop != null ? `<p class="ej-pop"><span>${fmtInt(lf.pop)}</span> people live within 5 miles</p>` : ''}
      ${bars}
    </section>`;
}

function historyStrip(h) {
  const chars = (h || '').padEnd(12, ' ').slice(0, 12).split('');
  const ordered = CONFIG.echoHistoryNewestFirst ? chars.reverse() : chars;
  const cls = c => c === 'S' ? 'q-s' : c === 'V' ? 'q-v' : c === '_' ? 'q-ok' : 'q-na';
  const word = c => c === 'S' ? 'significant violation' : c === 'V' ? 'violation' : c === '_' ? 'no violation' : 'no data';
  return `<div class="qstrip" role="img" aria-label="${ordered.map((c, i) => `Quarter ${i + 1}: ${word(c)}`).join('; ')}">${ordered.map(c => `<span class="q ${cls(c)}"></span>`).join('')}</div>`;
}

function echoSection(lf) {
  const ec = echoFor(lf);
  if (!ec) {
    return ECHO_LOADED ? `
    <section class="block">
      <h3>EPA compliance record</h3>
      <p class="note">${lf.frs ? `No row in the ECHO table matches this landfill’s FRS ID (${esc(lf.frs)}).` : 'This landfill has no FRS ID in Landfill Reference, so it can’t be matched to ECHO.'}</p>
    </section>` : '';
  }
  const labels = [ec.severity && `${ec.severity} severity`, ec.continuity, ec.repeat ? 'Repeat offender' : ''].filter(Boolean);
  const failed = /^error/i.test(ec.pullStatus);
  const hist = ec.programs.filter(pr => pr.history);
  const statusRows = ec.programs.filter(pr => pr.status && !/^\d+(\.\d+)?$/.test(pr.status));
  return `
    <section class="block">
      <h3>EPA compliance record</h3>
      <p class="note">From EPA’s ECHO database for FRS ID ${esc(ec.frs || lf.frs)}${ec.facName ? ` (${esc(ec.facName)})` : ''}. Inspection and enforcement counts cover the last five years; violation quarters cover the last three.</p>
      <div class="echo-head">
        ${echoBadge(ec, false)}
        ${ec.status && ECHO_LEVEL_TEXT[ec.level].toLowerCase() !== ec.status.toLowerCase() ? `<span class="echo-status">${esc(ec.status)}</span>` : ''}
        ${labels.map(l => `<span class="tag">${esc(l)}</span>`).join('')}
      </div>
      <dl class="stats">
        <div class="stat"><dt>Quarters in violation</dt><dd class="${ec.qtrsNC ? 'hot' : ''}">${ec.qtrsNC == null ? '—' : fmtInt(ec.qtrsNC)} <small>of 12</small></dd><span class="sub">last 3 years</span></div>
        <div class="stat"><dt>Inspections</dt><dd>${fmtInt(ec.inspections)}</dd><span class="sub">${ec.lastInspection ? 'last on ' + esc(fmtDate(ec.lastInspection)) : 'last 5 years'}</span></div>
        <div class="stat"><dt>Formal enforcement actions</dt><dd>${fmtInt(ec.formal)}</dd><span class="sub">${ec.lastFormal ? 'last on ' + esc(fmtDate(ec.lastFormal)) : (ec.informal != null ? fmtInt(ec.informal) + ' informal' : 'last 5 years')}</span></div>
        <div class="stat"><dt>Penalties</dt><dd>${fmtMoney(ec.penalties)}</dd><span class="sub">${ec.lastPenaltyDate ? 'last on ' + esc(fmtDate(ec.lastPenaltyDate)) + (ec.lastPenaltyAmt ? ', ' + fmtMoney(ec.lastPenaltyAmt) : '') : 'last 5 years'}</span></div>
      </dl>
      ${hist.length ? `
      <div class="qhist">
        <h4>Three years of compliance, by quarter</h4>
        ${hist.map(pr => `<div class="qrow"><span class="qname">${esc(pr.name)}</span>${historyStrip(pr.history)}<span class="qcount">${pr.qtrs != null ? plural(pr.qtrs, 'quarter') + ' in violation' : ''}</span></div>`).join('')}
        <div class="qaxis"><span></span><span>Oldest</span><span>Most recent</span></div>
        <div class="legend"><span><i class="q q-s"></i>Significant violation</span><span><i class="q q-v"></i>Violation</span><span><i class="q q-ok"></i>No violation</span><span><i class="q q-na"></i>No data</span></div>
      </div>` : ''}
      ${statusRows.length ? `<dl class="kv echo-kv">${statusRows.map(pr => `<dt>${esc(pr.name)}</dt><dd>${esc(pr.status)}</dd>`).join('')}</dl>` : ''}
      <p class="record">${[
        ec.url ? `<a href="${esc(ec.url)}" target="_blank" rel="noopener">EPA Detailed Facility Report</a>.` : '',
        ec.lastPull ? `ECHO data pulled ${esc(ec.lastPull)}.` : '',
        failed ? '<strong class="warn-inline">The most recent refresh for this facility failed, so these figures may be out of date.</strong>' : '',
      ].filter(Boolean).join(' ')}</p>
    </section>`;
}

function buildLandfillReport() {
  const lf = LANDFILLS.get(SELECTED_LF);
  if (!lf) { startMessage(); return; }
  const all = PLUMES.filter(p => p.lfId === lf.id).sort((a, b) => b.date - a.date);
  let range;
  try { range = getRange(all); } catch (e) { setStatus(e.message, 'error'); return; }
  if ($('#status').classList.contains('error')) restoreStatus();
  const { start, end, days } = range;

  const plumes = all.filter(p => p.date >= start && p.date <= end);
  const prevCount = days ? all.filter(p => p.date >= addDays(start, -days) && p.date < start).length : null;
  const clusters = computeClusters(plumes);
  const passes = new Set(plumes.map(p => p.scene)).size;
  const quantified = plumes.filter(p => p.rate != null);
  const hot = plumes.filter(isHot);
  const largest = quantified.length ? quantified.reduce((a, b) => (b.rate > a.rate ? b : a)) : null;
  const allQuant = all.filter(p => p.rate != null);
  const largestEver = allQuant.length ? allQuant.reduce((a, b) => (b.rate > a.rate ? b : a)) : null;
  const med = median(quantified.map(p => p.rate));
  const unq = plumes.length - quantified.length;
  const firstEver = all.length ? all[all.length - 1].date : null;
  const lastEver = all.length ? all[0].date : null;

  CURRENT = { downloads: [
    { label: 'Landfill data CSV', filename: `${lf.name}_landfill_data`, rows: () => landfillCsvRows([lf], start, end) },
    { label: 'Plumes CSV', filename: `${lf.name}_plumes_${ymd(start)}_to_${ymd(end)}`, rows: () => plumeCsvRows(plumes), disabled: !plumes.length },
  ] };

  const periodText = `${fmtDate(start)} to ${fmtDate(end)}`;
  const where = [lf.city, lf.state].filter(Boolean).join(', ');
  const head = headHTML(lf.name, [
    esc([where, lf.owner].filter(Boolean).join('. ')),
    `Landfill methane plumes, ${esc(periodText)}`,
  ], [
    lf.wit ? `<a class="btn" href="${esc(lf.wit)}" target="_blank" rel="noopener">Waste Impact Tracker</a>` : '',
    echoFor(lf)?.url ? `<a class="btn" href="${esc(echoFor(lf).url)}" target="_blank" rel="noopener">EPA ECHO report</a>` : '',
  ].join(''));

  let lead;
  if (plumes.length) {
    lead = `Between ${esc(fmtDate(start))} and ${esc(fmtDate(end))}, Carbon Mapper detected <strong>${plural(plumes.length, 'methane plume')}</strong> at ${esc(lf.name)}${passes > 1 ? ` across <strong>${plural(passes, 'satellite pass', 'satellite passes')}</strong>` : ''}.`;
    if (hot.length) lead += ` <strong>${hot.length.toLocaleString('en-US')}</strong> ${hot.length === 1 ? 'was' : 'were'} at or above the ${CONFIG.superEmitterKgHr} kg/hr super-emitter threshold.`;
    if (largest) lead += ` The largest, on ${esc(fmtDate(largest.date))}, was estimated at <strong>${esc(fmtRate(largest.rate))}</strong>.`;
    if (clusters.length) lead += ` ${clusters.length === 1 ? 'One pass' : clusters.length + ' passes'} caught more than one plume rising from the landfill at once.`;
    if (all.length > plumes.length) lead += ` There are ${plural(all.length, 'plume')} on record here since ${esc(fmtDate(firstEver))}.`;
  } else {
    lead = `Carbon Mapper didn’t detect any plumes at ${esc(lf.name)} between ${esc(fmtDate(start))} and ${esc(fmtDate(end))}.`;
    lead += all.length
      ? ` There ${all.length === 1 ? 'is' : 'are'} ${plural(all.length, 'plume')} on record here, most recently on ${esc(fmtDate(lastEver))}. Choose “All plumes on record” to see ${all.length === 1 ? 'it' : 'them'}.`
      : ` There are no plumes at this landfill in FCF’s records.`;
  }

  const ecLead = echoFor(lf);
  if (ecLead && ecLead.level === 'sig') lead += ` EPA’s ECHO database lists the facility in <strong>significant violation</strong>${ecLead.qtrsNC ? `, with violations in ${plural(ecLead.qtrsNC, 'quarter')} of the last 12` : ''}.`;
  else if (ecLead && ecLead.qtrsNC) lead += ` EPA’s ECHO database records violations in ${plural(ecLead.qtrsNC, 'quarter')} of the last 12.`;
  const prevSub = prevCount == null ? 'all plumes on record' : `${prevCount.toLocaleString('en-US')} in the previous ${days} days`;
  const stats = plumes.length ? `
    <dl class="stats">
      <div class="stat"><dt>Plumes detected</dt><dd>${plumes.length.toLocaleString('en-US')}</dd><span class="sub">${esc(prevSub)}</span></div>
      <div class="stat"><dt>Satellite passes with plumes</dt><dd>${passes.toLocaleString('en-US')}</dd><span class="sub">${plural(all.length, 'plume')} on record</span></div>
      <div class="stat"><dt>Super-emitter plumes</dt><dd class="${hot.length ? 'hot' : ''}">${hot.length.toLocaleString('en-US')}</dd><span class="sub">${CONFIG.superEmitterKgHr} kg/hr or more</span></div>
      <div class="stat"><dt>Largest plume</dt><dd class="${largest && isHot(largest) ? 'hot' : ''}">${largest ? fmtRateNum(largest.rate) + ' <small>kg/hr</small>' : '—'}</dd><span class="sub">${largest ? esc(fmtDate(largest.date)) : 'none quantified yet'}</span></div>
      <div class="stat"><dt>Median plume</dt><dd>${med == null ? '—' : fmtRateNum(med) + ' <small>kg/hr</small>'}</dd><span class="sub">${quantified.length} quantified${unq ? `, ${unq} not yet quantified` : ''}</span></div>
      <div class="stat"><dt>Plume clusters</dt><dd>${clusters.length.toLocaleString('en-US')}</dd><span class="sub">${clusters.length ? plural(clusters.reduce((n, c) => n + c.length, 0), 'plume') + ' in clusters' : 'one plume per pass'}</span></div>
    </dl>` : '';

  const card = plumes.length
    ? largestCard(largest, { showLandfill: false })
    : largestEver
      ? largestCard(largestEver, { title: 'Largest plume on record', showLandfill: false })
      : `<article class="panel largest"><div class="body"><h3>Plumes</h3><p>No plumes detected at this landfill in FCF’s records.</p></div></article>`;

  const gallery = plumes.length ? `
    <section class="block">
      <h3>Plume images</h3>
      <p class="note">Each plume on a satellite map${plumes.length > 24 ? `. Showing the 24 most recent of ${plumes.length}.` : '.'}</p>
      <div class="cl-grid">${plumes.slice(0, 24).map(p => `
        <figure class="cl-fig${p.image ? '' : ' noimg'}">${imgTag(p, 'Plume ' + p.name)}
          <figcaption>${esc(fmtDate(p.date))}<br><a href="${esc(p.portal)}" target="_blank" rel="noopener">${esc(p.name)}</a><br><span class="rate${isHot(p) ? ' hot' : ''}">${esc(fmtRate(p.rate))}</span></figcaption>
        </figure>`).join('')}</div>
    </section>` : '';

  const missingNote = LF_MISSING.length
    ? `<p class="foot noprint">Not shown because these Landfill Reference fields weren’t found: ${esc(LF_MISSING.join(', '))}.</p>` : '';

  $('#report').innerHTML = head +
    `<p class="lead">${lead}</p>` + stats +
    `<div class="split">${card}${aboutHTML(lf)}</div>` +
    communityHTML(lf) + echoSection(lf) +
    (plumes.length ? chartSection(plumes, start, end) + clusterSection(clusters, { showLandfill: false }) + gallery +
      `<section class="block"><h3>All plumes</h3><p class="note">Plume IDs link to the Carbon Mapper data portal.</p><div class="tablewrap" id="plumeTable"></div></section>` : '') +
    footHTML() + missingNote;

  if (plumes.length) sortableTable($('#plumeTable'), plumeColumns({ showLandfill: false }), plumes, 'date', 'desc');
  wireActions();
}

  };

function saveExplorer() { const e = readExplorer(); store.set('fcf_plume_report_explorer', JSON.stringify({ ...e, conds: e.allConds })); }
function restoreExplorer() {
  let e = {};
  try { e = JSON.parse(store.get('fcf_plume_report_explorer') || '{}'); } catch (x) {}
  $('#exOwner').value = e.owner || '';
  ['status', 'ownership', 'lfg', 'plumes', 'group', 'echo', 'continuity'].forEach(k => {
    const el = $('#ex' + k[0].toUpperCase() + k.slice(1));
    if (e[k] && [...el.options].some(o => o.value === e[k])) el.value = e[k];
  });
  $('#exRank').value = e.rank && exMetric(e.rank) ? e.rank : 'waste';
  $('#exConds').innerHTML = '';
  (e.conds || []).forEach(c => $('#exConds').appendChild(condRow(c)));
}
function clearExplorer() {
  $('#exOwner').value = '';
  ['#exStatus', '#exOwnership', '#exLfg', '#exPlumes', '#exGroup', '#exEcho', '#exContinuity'].forEach(s => { $(s).value = ''; });
  $('#exRank').value = 'waste';
  $('#exConds').innerHTML = '';
  $('#state').value = NATIONAL;
}

function aggregate(m, list) {
  if (m.agg === 'count') return list.length;
  const vals = list.map(l => [l, m.get(l)]).filter(([, v]) => v != null);
  if (!vals.length) return null;
  if (m.agg === 'sum') return vals.reduce((s, [, v]) => s + v, 0);
  if (m.agg === 'max') return Math.max(...vals.map(([, v]) => v));
  if (m.agg === 'mean') return vals.reduce((s, [, v]) => s + v, 0) / vals.length;
  if (m.agg === 'wpct') { let w = 0, s = 0; vals.forEach(([l, v]) => { if (l.pop) { w += l.pop; s += l.pop * v; } }); return w ? s / w : null; }
  return null;
}

function hbarChart(items, m) {
  if (!items.length) return '';
  const rowH = 30, W = 720, LW = 250, RW = 96, H = items.length * rowH + 8;
  const max = Math.max(...items.map(i => i.v || 0)) || 1;
  const trunc = s => s.length > 34 ? s.slice(0, 33) + '…' : s;
  const bars = items.map((it, i) => {
    const y = i * rowH + 4, w = Math.max(2, ((it.v || 0) / max) * (W - LW - RW));
    return `<text class="lbl hb-l" x="${LW - 10}" y="${y + rowH / 2}" text-anchor="end" dominant-baseline="middle">${esc(trunc(it.label))}</text>
      <rect class="${it.hot ? 'b-hot' : 'b-other'}" x="${LW}" y="${y + 5}" width="${w}" height="${rowH - 12}" rx="2"/>
      <text class="cnt" x="${LW + w + 8}" y="${y + rowH / 2}" dominant-baseline="middle">${esc(fmtMetric(m, it.v))}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(m.label)}: ${esc(items.map(i => `${i.label} ${fmtMetric(m, i.v)}`).join(', '))}">${bars}</svg>`;
}

function buildExplorer() {
  if (!LF_ALL_LOADED) return;
  const e = readExplorer();
  saveExplorer();
  const stSel = $('#state').value;
  const st = stSel && stSel !== NATIONAL ? STATES.find(s => s.id === stSel) : null;
  let range;
  try { range = getRange(PLUMES); } catch (x) { setStatus(x.message, 'error'); return; }
  if ($('#status').classList.contains('error')) restoreStatus();
  const { start, end } = range;

  // per-landfill plume figures
  const rows = [...LANDFILLS.values()].filter(l => l.name).map(l => {
    const ps = LF_PLUMES.get(l.id) || [];
    const rates = ps.filter(p => p.rate != null).map(p => p.rate);
    return Object.assign(l, {
      plumesAll: ps.length,
      plumesPeriod: ps.filter(p => p.date >= start && p.date <= end).length,
      largestRate: rates.length ? Math.max(...rates) : null,
    });
  });

  const ownerQ = e.owner.toLowerCase();
  const matches = rows.filter(l => {
    if (st && !(l.state.toLowerCase() === st.name.toLowerCase() || (st.abbr && l.stateAbbr.toLowerCase() === st.abbr.toLowerCase()))) return false;
    if (ownerQ && !l.owner.toLowerCase().includes(ownerQ)) return false;
    if (e.status && l.status !== e.status) return false;
    if (e.ownership && l.ownership !== e.ownership) return false;
    if (e.lfg && l.lfg !== e.lfg) return false;
    if (e.plumes === 'any' && !l.plumesAll) return false;
    if (e.plumes === 'period' && !l.plumesPeriod) return false;
    if (e.plumes === 'none' && l.plumesAll) return false;
    if (e.echo || e.continuity) {
      const ec = echoFor(l);
      if (e.echo === 'sig' && ec?.level !== 'sig') return false;
      if (e.echo === 'any' && !(ec && (ec.level === 'sig' || ec.level === 'viol' || ec.qtrsNC > 0))) return false;
      if (e.echo === 'none' && !(ec && ec.level === 'none' && !ec.qtrsNC)) return false;
      if (e.echo === 'matched' && !ec) return false;
      if (e.continuity && ec?.continuity !== e.continuity) return false;
    }
    for (const c of e.conds) {
      const v = exMetric(c.f)?.get(l), t = Number(c.v);
      if (v == null || !Number.isFinite(t)) return false;
      if (c.op === 'gte' ? v < t : v > t) return false;
    }
    return true;
  });

  // describe the selection
  const parts = [];
  if (e.status) parts.push(e.status.toLowerCase());
  if (e.ownership) parts.push(e.ownership.toLowerCase());
  const title = (e.owner || parts.length || st) ? `${e.owner ? e.owner + ' ' : ''}${parts.length ? parts.join(', ') + ' ' : ''}landfills${st ? ' in ' + st.name : ''}` : 'All landfills';
  const filterText = [
    e.lfg ? `Gas collection system: ${e.lfg.toLowerCase()}` : '',
    e.echo === 'sig' ? 'In significant violation (ECHO)' : e.echo === 'any' ? 'With ECHO violations in the last 3 years' : e.echo === 'none' ? 'No ECHO violations' : e.echo === 'matched' ? 'Matched to ECHO' : '',
    e.continuity ? `ECHO pattern: ${e.continuity}` : '',
    e.plumes === 'any' ? 'With plumes on record' : e.plumes === 'period' ? 'With plumes in this period' : e.plumes === 'none' ? 'No plumes on record' : '',
    ...e.conds.map(c => { const m = exMetric(c.f); return `${m.label} ${c.op === 'gte' ? 'at least' : 'at most'} ${m.pct ? fmtP(Number(c.v)) : Number(c.v).toLocaleString('en-US')}`; }),
  ].filter(Boolean);
  const periodText = `${fmtDate(start)} to ${fmtDate(end)}`;

  CURRENT = { downloads: [
    { label: 'Landfills CSV', filename: title.replace(/^./, c => c.toUpperCase()), rows: () => landfillCsvRows(matches, start, end), disabled: !matches.length },
  ] };

  const head = headHTML(title.replace(/^./, c => c.toUpperCase()), [
    filterText.length ? esc(filterText.join('. ')) : '',
    `Plume counts for ${esc(periodText)} and on record`,
  ]);

  if (!matches.length) {
    $('#report').innerHTML = head + `<div class="empty"><h3>No landfills match</h3><p>Try removing a filter or loosening a condition.</p></div>`;
    wireActions();
    return;
  }

  const tot = k => aggregate(exMetric(k), matches);
  const withPlumes = matches.filter(l => l.plumesAll).length;
  const ownersN = new Set(matches.map(l => l.owner.toLowerCase()).filter(Boolean)).size;
  const statesN = new Set(matches.map(l => l.state).filter(Boolean)).size;
  let lead = `<strong>${plural(matches.length, 'landfill')}</strong> match${matches.length === 1 ? 'es' : ''}`;
  lead += st ? '.' : `, across ${plural(statesN, 'state')}.`;
  if (tot('waste') != null) lead += ` Together they hold <strong>${fmtInt(tot('waste'))} metric tons</strong> of waste`;
  if (tot('ghgrp') != null) lead += `${tot('waste') != null ? ' and' : ' Together they'} reported <strong>${fmtInt(tot('ghgrp'))} metric tons</strong> of methane to the GHGRP`;
  if (tot('waste') != null || tot('ghgrp') != null) lead += '.';
  const sigN = matches.filter(l => echoFor(l)?.level === 'sig').length;
  if (ECHO_LOADED && sigN) lead += ` <strong>${sigN.toLocaleString('en-US')}</strong> ${sigN === 1 ? 'is' : 'are'} in significant violation according to EPA’s ECHO database.`;
  lead += ` ${withPlumes ? `<strong>${withPlumes.toLocaleString('en-US')}</strong> of them ${withPlumes === 1 ? 'has' : 'have'} plumes on record, with <strong>${plural(tot('plumesPeriod') || 0, 'plume')}</strong> between ${esc(fmtDate(start))} and ${esc(fmtDate(end))}.` : 'None has plumes on record.'}`;

  const stats = `
    <dl class="stats">
      <div class="stat"><dt>Landfills</dt><dd>${matches.length.toLocaleString('en-US')}</dd><span class="sub">${plural(ownersN, 'owner')}${st ? '' : ', ' + plural(statesN, 'state')}</span></div>
      <div class="stat"><dt>Waste in place</dt><dd>${fmtInt(tot('waste'))}</dd><span class="sub">metric tons</span></div>
      <div class="stat"><dt>GHGRP methane</dt><dd>${fmtInt(tot('ghgrp'))}</dd><span class="sub">metric tons reported</span></div>
      <div class="stat"><dt>People within 5 miles</dt><dd>${fmtInt(tot('pop'))}</dd><span class="sub">added across landfills</span></div>
      <div class="stat"><dt>With plumes on record</dt><dd>${withPlumes.toLocaleString('en-US')}</dd><span class="sub">${plural(tot('plumesAll') || 0, 'plume')} in total</span></div>
      <div class="stat"><dt>Plumes in period</dt><dd class="${tot('plumesPeriod') ? 'hot' : ''}">${(tot('plumesPeriod') || 0).toLocaleString('en-US')}</dd><span class="sub">${esc(periodText)}</span></div>
    </dl>`;

  // grouping + chart
  const rankM = exMetric(e.rank) || exMetric('waste');
  let groups = null, chartItems;
  if (e.group) {
    const keyOf = { owner: l => l.owner, state: l => l.state, status: l => l.status, ownership: l => l.ownership }[e.group];
    const gMap = new Map();
    matches.forEach(l => { const label = keyOf(l) || 'Not recorded'; const k = label.toLowerCase(); if (!gMap.has(k)) gMap.set(k, { label, list: [] }); gMap.get(k).list.push(l); });
    groups = [...gMap.values()].map(g => ({ ...g, rank: aggregate(rankM, g.list) }))
      .sort((a, b) => (b.rank ?? -1) - (a.rank ?? -1));
    chartItems = groups.slice(0, 15).map(g => ({ label: g.label, v: g.rank }));
  } else {
    const m = rankM.groupOnly ? exMetric('waste') : rankM;
    chartItems = matches.filter(l => m.get(l) != null).sort((a, b) => m.get(b) - m.get(a)).slice(0, 15)
      .map(l => ({ label: l.name + (st ? '' : `, ${l.stateAbbr || l.state}`), v: m.get(l), hot: l.plumesPeriod > 0 }));
  }
  const chartM = !e.group && rankM.groupOnly ? exMetric('waste') : rankM;
  const groupNames = { owner: 'owner', state: 'state', status: 'status', ownership: 'ownership type' };
  const chart = chartItems.length ? `
    <section class="block chart">
      <h3>${esc(e.group ? `${chartM.label}, by ${groupNames[e.group]}` : `Top landfills by ${chartM.label.replace(/^./, c => c.toLowerCase())}`)}</h3>
      <p class="note">${e.group ? `The ${Math.min(15, groups.length)} largest of ${plural(groups.length, groupNames[e.group])}.${chartM.agg === 'wpct' ? ' Percentages are weighted by population.' : ''}` : `The top ${chartItems.length} matching landfills. Coral bars had plumes in this period.`} Change “Rank by” to compare a different measure.</p>
      ${hbarChart(chartItems, chartM)}
    </section>` : '';

  const ejVals = weightedEj(matches);
  const ejHtml = EJ_METRICS.some(m => ejVals[m.key] != null) ? `
    <section class="block">
      <h3>Communities near these landfills</h3>
      <p class="note">Population-weighted across the ${plural(matches.length, 'matching landfill')}${st ? '' : ', compared with all landfill communities nationally'}.</p>
      ${ejBars(ejVals, st ? st.name : null, 'These landfills')}
    </section>` : '';

  const groupTable = groups ? `<section class="block"><h3>By ${esc(groupNames[e.group])}</h3><p class="note">Select a column heading to re-sort. “Filter” narrows the explorer to that ${esc(groupNames[e.group])}.</p><div class="tablewrap" id="exGroupTable"></div></section>` : '';

  $('#report').innerHTML = head + `<p class="lead">${lead}</p>` + stats + chart + ejHtml + groupTable +
    `<section class="block"><h3>Matching landfills</h3><p class="note">Landfill names link to Waste Impact Tracker, and Profile opens the full landfill profile.</p><div class="tablewrap" id="exTable"></div></section>` +
    `<p class="foot">Landfill data from FCF’s landfill tracker in Airtable; plume data from Carbon Mapper. People within 5 miles are added across landfills, so someone living near two landfills is counted twice. Built ${esc(fmtDateTime(new Date()))}.</p>`;

  if (groups) {
    const canFilter = e.group === 'owner' || e.group === 'state' || e.group === 'status' || e.group === 'ownership';
    sortableTable($('#exGroupTable'), [
      { key: 'label', label: groupNames[e.group].replace(/^./, c => c.toUpperCase()), value: g => g.label.toLowerCase(), html: g => esc(g.label) + (canFilter && g.label !== 'Not recorded' ? ` <button type="button" class="mini noprint" data-ex-filter="${esc(g.label)}">Filter</button>` : '') },
      { key: 'n', label: 'Landfills', num: true, value: g => g.list.length, html: g => g.list.length },
      { key: 'waste', label: 'Waste in place', num: true, value: g => aggregate(exMetric('waste'), g.list) ?? -1, html: g => fmtInt(aggregate(exMetric('waste'), g.list)) },
      { key: 'ghgrp', label: 'GHGRP methane', num: true, value: g => aggregate(exMetric('ghgrp'), g.list) ?? -1, html: g => fmtInt(aggregate(exMetric('ghgrp'), g.list)) },
      { key: 'pop', label: 'People within 5 mi', num: true, value: g => aggregate(exMetric('pop'), g.list) ?? -1, html: g => fmtInt(aggregate(exMetric('pop'), g.list)) },
      { key: 'bipoc', label: '% BIPOC', num: true, value: g => aggregate(exMetric('bipoc'), g.list) ?? -1, html: g => fmtP(aggregate(exMetric('bipoc'), g.list)) },
      ...(ECHO_LOADED ? [{ key: 'sig', label: 'Significant violators', num: true, value: g => g.list.filter(l => echoFor(l)?.level === 'sig').length, html: g => g.list.filter(l => echoFor(l)?.level === 'sig').length }] : []),
      { key: 'withPl', label: 'With plumes', num: true, value: g => g.list.filter(l => l.plumesAll).length, html: g => g.list.filter(l => l.plumesAll).length },
      { key: 'plP', label: 'Plumes in period', num: true, value: g => aggregate(exMetric('plumesPeriod'), g.list) || 0, html: g => aggregate(exMetric('plumesPeriod'), g.list) || 0 },
    ], groups, 'n', 'desc', 300);
  }

  sortableTable($('#exTable'), [
    { key: 'name', label: 'Landfill', value: l => l.name.toLowerCase(), html: l => lfLink(l.name, l.wit) + profileBtn(l.id) },
    ...(st ? [] : [{ key: 'state', label: 'State', value: l => (l.state || '').toLowerCase(), html: l => esc(l.stateAbbr || l.state || '—') }]),
    { key: 'owner', label: 'Owner', value: l => l.owner.toLowerCase(), html: l => esc(l.owner || '—') },
    { key: 'status', label: 'Status', value: l => l.status.toLowerCase(), html: l => esc(l.status || '—') },
    { key: 'waste', label: 'Waste in place', num: true, value: l => l.waste ?? -1, html: l => fmtInt(l.waste) },
    { key: 'ghgrp', label: 'GHGRP methane', num: true, value: l => l.ghgrp ?? -1, html: l => fmtInt(l.ghgrp) },
    { key: 'pop', label: 'People within 5 mi', num: true, value: l => l.pop ?? -1, html: l => fmtInt(l.pop) },
    { key: 'bipoc', label: '% BIPOC', num: true, value: l => l.bipocP ?? -1, html: l => fmtP(l.bipocP) },
    { key: 'lowIncome', label: '% low income', num: true, value: l => l.lowIncomeP ?? -1, html: l => fmtP(l.lowIncomeP) },
    ...(ECHO_LOADED ? [
      { key: 'echo', label: 'EPA compliance', value: l => ({ sig: 3, viol: 2, none: 1 }[echoFor(l)?.level] || 0), html: l => echoBadge(echoFor(l)) },
      { key: 'qtrsNC', label: 'Quarters in violation', num: true, value: l => echoFor(l)?.qtrsNC ?? -1, html: l => fmtInt(echoFor(l)?.qtrsNC) },
    ] : []),
    { key: 'plumesPeriod', label: 'Plumes in period', num: true, value: l => l.plumesPeriod, html: l => l.plumesPeriod, hot: l => l.plumesPeriod > 0 },
    { key: 'plumesAll', label: 'Plumes on record', num: true, value: l => l.plumesAll, html: l => l.plumesAll },
    { key: 'largest', label: 'Largest (kg/hr)', num: true, value: l => l.largestRate ?? -1, html: l => fmtRateNum(l.largestRate), hot: l => l.largestRate != null && l.largestRate >= CONFIG.superEmitterKgHr },
  ], matches, rankM.groupOnly || rankM.agg === 'none' ? 'waste' : ({ capP: 'waste', acceptance: 'waste', co2e20: 'ghgrp', under5: 'bipoc', over64: 'bipoc', largest: 'largest', formal: ECHO_LOADED ? 'qtrsNC' : 'waste', penalties: ECHO_LOADED ? 'qtrsNC' : 'waste', inspections: ECHO_LOADED ? 'qtrsNC' : 'waste', severityScore: ECHO_LOADED ? 'qtrsNC' : 'waste', qtrsNC: ECHO_LOADED ? 'qtrsNC' : 'waste' }[rankM.key] || rankM.key), 'desc', 300);

  wireActions();
}

function applyGroupFilter(label) {
  const g = $('#exGroup').value;
  if (g === 'owner') $('#exOwner').value = label;
  else if (g === 'status') $('#exStatus').value = label;
  else if (g === 'ownership') $('#exOwnership').value = label;
  else if (g === 'state') { const st = stateFor(label); if (st) $('#state').value = st.id; }
  $('#exGroup').value = '';
  buildExplorer();
  window.scrollTo({ top: 0 });
}

/* ---------- chart, tables, export ---------- */
function chartSVG(plumes, start, end) {
  const weekly = (end - start) / 864e5 <= 62;
  const buckets = [];
  if (weekly) {
    for (let d = startOfDay(start); d <= end; d = addDays(d, 7)) buckets.push({ from: d, to: addDays(d, 7), label: d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) });
  } else {
    let d = new Date(start.getFullYear(), start.getMonth(), 1);
    const multiYear = start.getFullYear() !== end.getFullYear();
    while (d <= end) {
      const next = new Date(d.getFullYear(), d.getMonth() + 1, 1);
      const m = d.toLocaleDateString('en-US', { month: 'short' });
      buckets.push({ from: d, to: next, label: multiYear && (d.getMonth() === 0 || !buckets.length) ? `${m} ${d.getFullYear()}` : m });
      d = next;
    }
  }
  buckets.forEach(b => {
    const inB = plumes.filter(p => p.date >= b.from && p.date < b.to);
    b.hot = inB.filter(isHot).length;
    b.other = inB.length - b.hot;
  });
  const W = 720, H = 230, L = 8, R = 8, T = 20, B = 28;
  const n = buckets.length, slot = (W - L - R) / n, bw = Math.min(56, slot * 0.66);
  const max = Math.max(1, ...buckets.map(b => b.hot + b.other));
  const y = v => (H - B) - (v / max) * (H - B - T);
  const every = Math.ceil(n / 12);
  let g = `<line class="axis" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>`;
  buckets.forEach((b, i) => {
    const x = L + i * slot + (slot - bw) / 2, total = b.hot + b.other;
    if (b.other) g += `<rect class="b-other" x="${x}" y="${y(b.other)}" width="${bw}" height="${(H - B) - y(b.other)}"/>`;
    if (b.hot) g += `<rect class="b-hot" x="${x}" y="${y(total)}" width="${bw}" height="${y(b.other) - y(total)}"/>`;
    if (total && n <= 26) g += `<text class="cnt" x="${x + bw / 2}" y="${y(total) - 6}" text-anchor="middle">${total}</text>`;
    if (i % every === 0) g += `<text class="lbl" x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${esc(b.label)}</text>`;
  });
  const summary = buckets.map(b => `${b.label}: ${b.hot + b.other}`).join(', ');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Plumes per ${weekly ? 'week' : 'month'}. ${esc(summary)}">${g}</svg>`;
}

function sortableTable(container, cols, rows, key, dir, limit = Infinity) {
  function render() {
    const c = cols.find(c => c.key === key);
    const sortedAll = [...rows].sort((a, b) => {
      const va = c.value(a), vb = c.value(b);
      const r = va < vb ? -1 : va > vb ? 1 : 0;
      return dir === 'asc' ? r : -r;
    });
    const sorted = sortedAll.slice(0, limit);
    container.innerHTML = `<table><thead><tr>${cols.map(c => `
      <th class="${c.num ? 'num' : ''}" ${c.key === key ? `aria-sort="${dir === 'asc' ? 'ascending' : 'descending'}"` : ''}>
        <button type="button" data-key="${c.key}">${esc(c.label)}${c.key === key ? (dir === 'asc' ? ' ▲' : ' ▼') : ''}</button>
      </th>`).join('')}</tr></thead>
      <tbody>${sorted.map(r => `<tr>${cols.map(c => `<td class="${[c.num ? 'num' : '', c.cls || '', c.hot && c.hot(r) ? 'hot' : ''].join(' ').trim()}">${c.html(r)}</td>`).join('')}</tr>`).join('')}</tbody></table>` +
      (sortedAll.length > sorted.length ? `<p class="note" style="margin-top:10px">Showing the first ${sorted.length.toLocaleString('en-US')} of ${sortedAll.length.toLocaleString('en-US')}. Download the CSV for all of them.</p>` : '');
    container.querySelectorAll('th button').forEach(btn => btn.addEventListener('click', () => {
      const k = btn.dataset.key;
      if (k === key) dir = dir === 'asc' ? 'desc' : 'asc';
      else { key = k; dir = cols.find(c => c.key === k).num || k === 'date' ? 'desc' : 'asc'; }
      render();
      container.querySelector(`th button[data-key="${k}"]`).focus();
    }));
  }
  render();
}

function wireActions() {
  $('#shareBtn')?.addEventListener('click', copyShareLink);

}

const ECHO_SKIP = /^(frs id|frs id clean|state abbreviation|state name|landfill alias|city|county|landfill owner organization\(s\)|landfill operator organization|year landfill opened|falls under nsps\/eg|landfill reference|updated frs id|date frs id last modified|echo changes|summary \(echo changes\)|headline \(echo changes\))$|\(from landfill reference\)/i;

function cellText(v) {
  if (v == null) return '';
  if (Array.isArray(v)) return v.map(cellText).filter(Boolean).join('; ');
  if (typeof v === 'object') return v.name || v.url || v.email || '';
  if (typeof v === 'boolean') return v ? 'Yes' : 'No';
  return String(v);
}
const REC_ID = /^rec[A-Za-z0-9]{14}$/;
const isRecIds = v => Array.isArray(v) ? v.length > 0 && v.every(x => typeof x === 'string' && REC_ID.test(x)) : typeof v === 'string' && REC_ID.test(v);
function usefulKeys(objs) {
  const keys = new Set();
  objs.forEach(o => Object.keys(o || {}).forEach(k => keys.add(k)));
  return [...keys].filter(k => objs.some(o => { const v = o?.[k]; return v != null && v !== '' && !isRecIds(v); }));
}
const lrDescIndex = k => { const n = normKey(k); const i = LR_DESCRIPTIONS.findIndex(([re]) => re.test(n)); return i < 0 ? 999 : i; };
const lrDesc = k => { const i = lrDescIndex(k); return i < 999 ? LR_DESCRIPTIONS[i][1] : 'Field from FCF’s Landfill Reference table in Airtable.'; };

function landfillCsvRows(list, start, end) {
  const byLf = new Map();
  PLUMES.forEach(p => { if (p.lfId) { if (!byLf.has(p.lfId)) byLf.set(p.lfId, []); byLf.get(p.lfId).push(p); } });
  const lrKeys = usefulKeys(list.map(l => l.raw)).sort((a, b) => lrDescIndex(a) - lrDescIndex(b) || a.localeCompare(b));
  const echoOrder = Object.keys(ECHO_DESCRIPTIONS);
  const ecKeys = usefulKeys(list.map(l => echoFor(l)?.raw)).filter(k => !ECHO_SKIP.test(k))
    .sort((a, b) => ((echoOrder.indexOf(a) + 1) || 999) - ((echoOrder.indexOf(b) + 1) || 999) || a.localeCompare(b));
  const period = `${ymd(start)} to ${ymd(end)}`;
  const stats = l => {
    const ps = byLf.get(l.id) || [];
    const inP = ps.filter(p => p.date >= start && p.date <= end);
    const q = ps.filter(p => p.rate != null);
    const big = q.length ? q.reduce((a, b) => (b.rate > a.rate ? b : a)) : null;
    const latest = ps.length ? ps.reduce((a, b) => (b.date > a.date ? b : a)) : null;
    return { ps, inP, big, latest };
  };
  const comp = [
    ['Plumes on record', 'Carbon Mapper methane plumes matched to this landfill in FCF’s Airtable, all dates.', (l, x) => x.ps.length],
    [`Plumes ${period}`, `Carbon Mapper plumes detected at this landfill between ${period}.`, (l, x) => x.inP.length],
    [`Super-emitter plumes ${period}`, `Plumes of ${CONFIG.superEmitterKgHr} kg/hr or more between ${period}.`, (l, x) => x.inP.filter(isHot).length],
    ['Largest plume on record (kg/hr)', 'Highest estimated emission rate of any plume at this landfill, in kilograms of methane per hour.', (l, x) => x.big ? x.big.rate : ''],
    ['Largest plume date', 'Date of the largest plume, in UTC.', (l, x) => x.big ? x.big.date.toISOString().slice(0, 10) : ''],
    ['Largest plume link', 'The largest plume on the Carbon Mapper data portal.', (l, x) => x.big ? x.big.portal : ''],
    ['Most recent plume date', 'Date of the most recent plume, in UTC.', (l, x) => x.latest ? x.latest.date.toISOString().slice(0, 10) : ''],
    ['Plume clusters on record', 'Satellite passes that caught two or more plumes at this landfill at once.', (l, x) => computeClusters(x.ps).length],
    ['FCF report link', 'Opens this landfill’s profile in FCF’s report tool (team password needed).', l => `${location.origin}${location.pathname}?view=landfill&landfill=${l.id}`],
  ];
  const tidy = k => k.replace(/\s+/g, ' ').trim();   // some tracker column names contain line breaks
  const names = [...lrKeys.map(tidy), ...ecKeys.map(k => 'ECHO: ' + tidy(k)), ...comp.map(c => c[0])];
  const descs = [...lrKeys.map(lrDesc), ...ecKeys.map(k => ECHO_DESCRIPTIONS[k] || 'Field from FCF’s ECHO table in Airtable.'), ...comp.map(c => c[1])];
  const rows = list.map(l => {
    const ec = echoFor(l), x = stats(l);
    return [...lrKeys.map(k => cellText(l.raw?.[k])), ...ecKeys.map(k => cellText(ec?.raw?.[k])), ...comp.map(c => c[2](l, x))];
  });
  return [names, descs, ...rows];
}

function plumeCsvRows(plumes) {
  const cols = [
    ['Plume ID', 'Carbon Mapper plume ID. Everything before the final letter is the scene ID.', p => p.name],
    ['Detected (UTC)', 'Date and time of the detection, in UTC.', p => p.date.toISOString()],
    ['State', 'State the plume was matched to.', p => p.stateName],
    ['Landfill', 'Landfill the plume was matched to by FCF.', p => p.landfill],
    ['Owner', 'Organization(s) that own the landfill.', p => p.owner],
    ['Landfill status', 'Whether the landfill is open or closed.', p => landfillInfo(p).status],
    ['Emissions (kg/hr)', 'Carbon Mapper’s estimated emission rate in kilograms of methane per hour. Blank means not yet quantified.', p => p.rate ?? ''],
    ['Uncertainty (kg/hr)', 'Carbon Mapper’s uncertainty for the emission rate, plus or minus.', p => p.unc ?? ''],
    ['Super-emitter', `Yes if the plume is ${CONFIG.superEmitterKgHr} kg/hr or more.`, p => isHot(p) ? 'Yes' : 'No'],
    ['Instrument', 'Satellite or aircraft instrument that detected the plume.', p => p.platform],
    ['Scene ID', 'Carbon Mapper scene. Plumes sharing a scene ID at one landfill form a cluster.', p => p.scene],
    ['Carbon Mapper link', 'The plume on the Carbon Mapper data portal.', p => p.portal],
    ['FRS ID', 'EPA Facility Registry Service ID of the landfill.', p => LANDFILLS.get(p.lfId)?.frs || ''],
    ['EPA compliance status', 'The landfill’s current overall compliance status in EPA’s ECHO database.', p => landfillInfo(p).echo?.status || ''],
    ['EPA ECHO report', 'Link to EPA’s Detailed Facility Report for the landfill.', p => landfillInfo(p).echo?.url || ''],
    ['Waste Impact Tracker', 'The landfill’s page on FCF’s Waste Impact Tracker.', p => landfillInfo(p).wit],
  ];
  return [cols.map(c => c[0]), cols.map(c => c[1]), ...plumes.map(p => cols.map(c => c[2](p)))];
}

function downloadCSV(d) {
  if (!d) return;
  const rows = d.rows();
  if (rows.length < 3) return;
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  // BOM so Excel reads the ’ and accented characters correctly
  const blob = new Blob(['\ufeff' + rows.map(r => r.map(q).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${d.filename.replace(/[^a-z0-9]+/gi, '_')}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- start-up ---------- */
function showConnect() {
  $('#connect').hidden = false;
  $('#connectTitle').textContent = usePassword ? 'Unlock the report' : 'Connect to Airtable';
  $('#connectHelp').textContent = usePassword
    ? 'Type the team password. Ask Kim if you don’t have it.'
    : 'Paste a read-only Airtable personal access token for the Full Circle Future Matching base. It’s kept in this browser only and is sent nowhere except Airtable.';
  $('#secretLabel').textContent = usePassword ? 'Team password' : 'Personal access token';
  $('#token').placeholder = usePassword ? '' : 'pat…';
  $('#token').autocomplete = usePassword ? 'current-password' : 'off';
  $('#modeSwitch').hidden = !CONFIG.encryptedToken;
  $('#modeSwitch').textContent = usePassword ? 'Use my own Airtable token instead' : 'Use the team password instead';
}

function toggleCustom() {
  const custom = $('#preset').value === 'custom';
  document.querySelectorAll('.field.custom').forEach(el => { el.hidden = !custom; });
}

(function init() {
  const today = new Date();
  $('#to').value = ymd(today);
  $('#from').value = ymd(addDays(today, -89));
  const savedPreset = store.get('fcf_plume_report_preset');
  if (savedPreset && [...$('#preset').options].some(o => o.value === savedPreset)) $('#preset').value = savedPreset;
  toggleCustom();
  applyMode();

  document.querySelectorAll('.modes [data-mode]').forEach(b => b.addEventListener('click', () => { if (b.dataset.mode !== MODE) setMode(b.dataset.mode); }));

  $('#preset').addEventListener('change', () => {
    toggleCustom();
    store.set('fcf_plume_report_preset', $('#preset').value);
    if ($('#preset').value === 'custom') return;
    if (MODE === 'explore' || (MODE === 'state' ? $('#state').value : SELECTED_LF)) buildReport();
  });
  $('#state').addEventListener('change', () => { if ($('#state').value || MODE === 'explore') buildReport(); });
  $('#form').addEventListener('submit', e => {
    e.preventDefault();
    if (MODE === 'landfill' && !$('#lfResults').hidden) {
      const firstBtn = $('#lfResults button[data-pick]');
      if (firstBtn) { pickLandfill(firstBtn.dataset.pick); return; }
    }
    buildReport();
  });

  // landfill search
  $('#lfq').addEventListener('input', renderResults);
  $('#lfq').addEventListener('focus', () => { if ($('#lfq').value && SELECTED_LF && LANDFILLS.get(SELECTED_LF)?.name === $('#lfq').value) $('#lfq').select(); else renderResults(); });
  $('#lfq').addEventListener('keydown', e => {
    if (e.key === 'Escape') hideResults();
    if (e.key === 'ArrowDown') { const b = $('#lfResults button'); if (b) { e.preventDefault(); b.focus(); } }
  });
  $('#lfResults').addEventListener('keydown', e => {
    const btns = [...$('#lfResults').querySelectorAll('button')];
    const i = btns.indexOf(document.activeElement);
    if (e.key === 'ArrowDown' && i < btns.length - 1) { e.preventDefault(); btns[i + 1].focus(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); (i > 0 ? btns[i - 1] : $('#lfq')).focus(); }
    if (e.key === 'Escape') { hideResults(); $('#lfq').focus(); }
  });
  $('#lfResults').addEventListener('click', e => { const b = e.target.closest('[data-pick]'); if (b) pickLandfill(b.dataset.pick); });
  $('#onlyPlumes').addEventListener('change', () => { $('#lfq').focus(); renderResults(); });
  document.addEventListener('click', e => { if (!e.target.closest('.lf-search') && !e.target.closest('#onlyPlumesWrap')) hideResults(); });

  // "Profile" and "Filter" buttons inside reports
  $('#report').addEventListener('click', e => {
    const b = e.target.closest('[data-open-lf]'); if (b) { openLandfill(b.dataset.openLf); return; }
    const f = e.target.closest('[data-ex-filter]'); if (f) applyGroupFilter(f.dataset.exFilter);
  });

  // explorer filters update the results as you change them
  let exTimer;
  const exUpdate = () => { clearTimeout(exTimer); exTimer = setTimeout(() => { if (MODE === 'explore') buildExplorer(); }, 250); };
  $('#exFilters').addEventListener('input', exUpdate);
  $('#exFilters').addEventListener('change', exUpdate);
  $('#exAddCond').addEventListener('click', () => { const r = condRow({ f: 'waste' }); $('#exConds').appendChild(r); r.querySelector('.c-val').focus(); });
  $('#exConds').addEventListener('click', e => { const d = e.target.closest('.c-del'); if (d) { d.closest('.cond').remove(); exUpdate(); } });
  $('#exReset').addEventListener('click', () => { clearExplorer(); buildExplorer(); });

  $('#connectBtn').addEventListener('click', async () => {
    const v = $('#token').value.trim();
    if (!v) { setStatus(usePassword ? 'Type the team password first.' : 'Paste your Airtable token first.', 'error'); return; }
    if (usePassword) {
      setStatus('Unlocking…');
      try { token = await unlockToken(CONFIG.encryptedToken, v); }
      catch (e) { setStatus('That password didn’t work. Check it and try again.', 'error'); $('#token').select(); return; }
    } else {
      token = v;
    }
    if ($('#remember').checked) store.set(TOKEN_KEY, token);
    $('#token').value = '';
    loadData();
  });
  $('#token').addEventListener('keydown', e => { if (e.key === 'Enter') $('#connectBtn').click(); });
  $('#modeSwitch').addEventListener('click', () => { usePassword = !usePassword; setStatus(''); showConnect(); });

  $('#setupBtn').addEventListener('click', async () => {
    const tok = $('#setupToken').value.trim(), pw = $('#setupPw').value, pw2 = $('#setupPw2').value;
    if (!tok) { setStatus('Paste the Airtable token first.', 'error'); return; }
    if (pw.length < 12) { setStatus('Use a team password of at least 12 characters. Four random words works well.', 'error'); return; }
    if (pw !== pw2) { setStatus('The two passwords don’t match.', 'error'); return; }
    setStatus('Checking the token with Airtable…');
    try {
      const res = await fetch(`https://api.airtable.com/v0/${CONFIG.baseId}/${CONFIG.stateTable}?pageSize=1`, { headers: { Authorization: 'Bearer ' + tok } });
      if (!res.ok) { setStatus(`Airtable didn’t accept this token (error ${res.status}). Check it has data.records:read and access to the Full Circle Future Matching base.`, 'error'); return; }
    } catch (e) { setStatus('Couldn’t reach Airtable to check the token. Check your connection and try again.', 'error'); return; }
    $('#setupOut').value = await lockToken(tok, pw);
    $('#setupResult').hidden = false;
    $('#setupToken').value = ''; $('#setupPw').value = ''; $('#setupPw2').value = '';
    setStatus('Token works and is locked. Copy the locked token into CONFIG.');
  });
  $('#copyBtn').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText($('#setupOut').value); setStatus('Locked token copied.'); }
    catch (e) { $('#setupOut').select(); setStatus('Press Ctrl+C (or Cmd+C) to copy the selected text.'); }
  });

  $('#reload').addEventListener('click', loadData);
  $('#disconnect').addEventListener('click', () => {
    store.del(TOKEN_KEY); token = null; STATES = []; PLUMES = []; CURRENT = null;
    LANDFILLS = new Map(); LF_ALL_LOADED = false; LF_INDEX = [];
    showTools(false); showConnect();
    $('#report').innerHTML = '';
    setStatus('Disconnected. The token was removed from this browser.');
  });

  if (location.hash === '#setup') { $('#setup').hidden = false; return; }
  token = store.get(TOKEN_KEY);
  if (token) loadData();
  else showConnect();
})();
</script>
